name: Linux

on:
  push:
    branches: [main, 'linux/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Debug info makes the build several times larger on disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_BUILD_JOBS: 2

jobs:
  workspace:
    name: workspace (ubuntu-latest)
    runs-on: ubuntu-latest
    # A cold build of the whole workspace takes over 40 minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # A full debug build of the workspace with its tests takes more than
      # the runner's free disk; the build died with exit 143 at about 8 min.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # rustc on the largest crates (app, daemon, CLI) starved the runner of
      # memory until it lost contact; swap and two jobs keep it alive.
      - name: Swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h

      # isocastd links OpenSSL and FFmpeg (bindings generated with
      # libclang); isocast-ui links fontconfig and freetype. Mesa's lavapipe
      # is a software Vulkan device for the GPU paths on a GPU-less runner.
      - name: System libraries
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config clang libclang-dev libssl-dev libfontconfig1-dev
          libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev
          mesa-vulkan-drivers

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version --verbose
          cargo --version

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: linux-workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all --check

      # isocast-app is the retired macOS web-view app.
      - name: Build
        id: build
        run: cargo build --locked --workspace --exclude isocast-app --all-targets

      - name: Disk after build
        if: ${{ !cancelled() }}
        run: df -h /

      - name: Clippy
        run: cargo clippy --locked --keep-going --workspace --exclude isocast-app --all-targets -- -D warnings

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --locked --no-fail-fast --workspace --exclude isocast-app
